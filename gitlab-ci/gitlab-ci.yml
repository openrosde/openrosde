# Documentation for configuration of GitLab CI jobs with 'gitlab-ci.yml':
# https://docs.gitlab.com/ee/ci/yaml/
# https://docs.gitlab.com/ee/ci/docker/using_docker_build.html
# https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#limitations-of-docker-in-docker

# See 'SETUP-GITLAB-RUNNER.bash' for the runner configuration details.

################################################################################

# Define the pipeline stages.
# https://docs.gitlab.com/ee/ci/yaml/#stage

stages:
  - build-stage
  - test-stage
  - deploy-stage

################################################################################

# Define the common configuration of Docker-in-Docker for all jobs.

# Use Docker-in-Docker with TLS disabled in the Docker executor.
# https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#docker-in-docker-with-tls-disabled-in-the-docker-executor
image: docker:latest
variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
services:
  - docker:dind
before_script:
  - docker info

# Create a mount point to share files between the Docker-in-Docker container and the child containers.
# https://docs.gitlab.com/ee/ci/docker/using_docker_build.html#limitations-of-docker-in-docker
# https://gitlab.com/gitlab-org/gitlab-foss/-/issues/41227
variables:
  SDE_MOUNT_POINT: /builds/${CI_PROJECT_PATH}/mnt
  SDE_CONTAINER_ROOT_DIR: /root/SDE
before_script:
  # Download all the missing Git submodules inside the project workspace.
  - apk update
  - apk add git
  - git submodule update --init --recursive
  # Copy the content of the project workspace to the mount point.
  - mkdir -p ${SDE_MOUNT_POINT}/
  - cp -r ./ros/ ./docker/ ./scripts/ ./.env ${SDE_MOUNT_POINT}/
after_script:
  # Copy the content of the mount point back to the project workspace.
  # Note: This extra step is required due to some path limitations with the GitLab CI 'artifacts' command.
  - cp -r ${SDE_MOUNT_POINT}/. ./

################################################################################

# Build the Catkin workspace inside a Docker container instance of the platform-specific image.

build-catkin-workspace-job:
  stage: build-stage
  parallel:
    matrix:
      - SDE_PLATFORM: [turtlebot3, ur5e]
  script:
    # Build the Catkin workspace inside the Docker container of the project workspace that is mapped to the mount point.
    - docker login -u "<deploy-token-user>" --password-stdin registry.gitlab.com/coarobo/sde
    - docker run
      -e CI=${CI}
      -e SDE_PLATFORM=${SDE_PLATFORM}
      -e SDE_CONTAINER_ROOT_DIR=${SDE_CONTAINER_ROOT_DIR}
      -v ${SDE_MOUNT_POINT}/:${SDE_CONTAINER_ROOT_DIR}/
      ${CI_REGISTRY_IMAGE}/${SDE_PLATFORM}-devel:latest ${SDE_CONTAINER_ROOT_DIR}/docker/sde-base/scripts/reset-catkin-workspace.bash
  # Save the build result to pass it to the next jobs.
  artifacts:
    name: ${CI_COMMIT_SHA}-${SDE_PLATFORM}
    paths:
      # Note: Only paths relative to the project workspace can be used, thus '${SDE_MOUNT_POINT}/' is not permitted.
      # https://docs.gitlab.com/ee/ci/yaml/#artifacts
      # https://gitlab.com/gitlab-org/gitlab-foss/-/issues/15530
      - ./ros/sde_catkin_ws/
      - ./ros/${SDE_PLATFORM}_catkin_ws/
    expire_in: 1 week

################################################################################

# Run unit tests inside Docker container instances of the platform-specific image.

run-unit-test1-job:
  stage: test-stage
  script:
    - echo "Running unit test 1... Completed!"

run-unit-test2-job:
  stage: test-stage
  script:
    - echo "Running unit test 2... Completed!"


################################################################################

# Deploy results of the unit tests inside a Docker container instance of the platform-specific image.

deploy-test-results-job:
  stage: deploy-stage
  script:
    - echo "Deploying test results... Completed!"
