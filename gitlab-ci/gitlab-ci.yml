# Documentation for configuration of GitLab CI jobs with 'gitlab-ci.yml':
# https://docs.gitlab.com/ci/yaml/
# https://docs.gitlab.com/ci/pipelines/downstream_pipelines/#dynamic-child-pipelines

# This parent pipeline generates the child pipeline of the SDE, with one image job and one test job per platform found by name, then runs it.
# The child pipeline builds or reuses the base and platform images, builds the Catkin workspaces of every platform inside its image, and publishes the images as 'dev' or 'main' from those branches.
# Every job hands its results through the registry, and every artifact expires, so the pipeline runs the same on a self-managed runner and on the instance runners of GitLab.com.

################################################################################

# Run one pipeline per change: for a merge request, or for a branch without an open merge request.
# https://docs.gitlab.com/ci/yaml/workflow/#switch-between-branch-pipelines-and-merge-request-pipelines

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

################################################################################

# Select the runner by its tag.
# 'privileged-docker' is the tag of a self-managed Docker executor with privileged mode, which Docker-in-Docker needs.
# To run on the instance runners of GitLab.com instead, enable them on the project and run the pipeline with 'SDE_CI_RUNNER_TAG' set to one of their tags, such as 'saas-linux-medium-amd64'.

variables:
  SDE_CI_RUNNER_TAG: privileged-docker

################################################################################

# Define the pipeline stages.

stages:
  - generate-stage
  - run-stage

################################################################################

# Run the pipeline only when something that goes into an image or a workspace changes, so that a change of the documentation alone runs nothing.
# A pipeline started by hand or on a schedule always runs.

.sde-image-changes:
  rules: &sde-image-changes-rules
    - changes:
        - .env
        - .gitmodules
        - docker/**/*
        - env/**/*
        - gitlab-ci/**/*
        - patches/**/*
        - ros/**/*
        - scripts/**/*
        - tmux/**/*

################################################################################

# Generate the child pipeline, which lives for a day as an artifact.

generate-pipeline-job:
  stage: generate-stage
  image: docker:29.8.1-cli
  tags:
    - $SDE_CI_RUNNER_TAG
  interruptible: true
  rules: *sde-image-changes-rules
  script:
    - apk add --no-cache bash > /dev/null
    - bash ./gitlab-ci/generate-ci-pipeline.bash > sde-pipeline-generated.yml
    - cat sde-pipeline-generated.yml
  artifacts:
    paths:
      - sde-pipeline-generated.yml
    expire_in: 1 day

################################################################################

# Run the child pipeline, which passes the branch to publish, if any, the target branch of a merge request, if any, and the tag of the runner.

run-pipeline-job:
  stage: run-stage
  rules: *sde-image-changes-rules
  trigger:
    include:
      - artifact: sde-pipeline-generated.yml
        job: generate-pipeline-job
    strategy: depend
  variables:
    SDE_CI_PUBLISH_TAG: $CI_COMMIT_BRANCH
    SDE_CI_TARGET_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
