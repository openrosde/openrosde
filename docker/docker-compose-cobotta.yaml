# version: "3.9"

################################################################################

# Denso COBOTTA platform overlay for OpenRoSDE.
# Passes COBOTTA-specific environment variables to the container.

################################################################################

services:
  openrosde:
    environment:
      # No platform-specific environment variables for the Denso COBOTTA at this time.
      - OPENROSDE_ROBOT_PLATFORM=${OPENROSDE_ROBOT_PLATFORM}
