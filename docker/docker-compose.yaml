# version: "3.9"

################################################################################

services:
  sde-base:
    image: registry.gitlab.com/coarobo/sde/sde-base:latest
    build:
      context: ../
      dockerfile: ./docker/sde-base/Dockerfile
      args:
        - SDE_DOCKERFILE_COMMIT_SHORT_SHA=${SDE_BASE_DOCKERFILE_COMMIT_SHORT_SHA}

  sde:
    hostname: sde-${SDE_PLATFORM}
    container_name: sde_${SDE_PLATFORM}_${SDE_DOCKER_PROJECT}-1
    privileged: true
    environment:
      # Pass current user and group IDs.
      - SDE_USER_ID=${SDE_USER_ID}
      - SDE_GROUP_ID=${SDE_GROUP_ID}
      # Display X Server GUIs.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Configure the PulseAudio interface.
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      # Pass the platform identifier to the container.
      - SDE_PLATFORM=${SDE_PLATFORM}
    image: registry.gitlab.com/coarobo/sde/${SDE_PLATFORM}-devel:latest
    build:
      context: ../
      dockerfile: ./docker/${SDE_PLATFORM}-devel/Dockerfile
      args:
        - SDE_DOCKERFILE_COMMIT_SHORT_SHA=${SDE_PLATFORM_DOCKERFILE_COMMIT_SHORT_SHA}
        - SDE_PLATFORM=${SDE_PLATFORM}
    volumes:
      # Map repository root for convenient access.
      - ../:/root/SDE/
      # Grant display access to X Server.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Grant audio access to PulseAudio.
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
    devices:
      - /dev/:/dev/
    network_mode: host
    ipc: host
    pid: host
    command: /root/SDE/docker/sde-base/scripts/initialize-docker-container.bash
