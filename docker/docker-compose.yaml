# version: "3.9"

################################################################################

services:
  sde-base:
    image: registry.gitlab.com/coarobo/sde/sde-devel:latest
    build:
      context: ../
      dockerfile: ./docker/sde-devel/Dockerfile
      args:
        - SDE_DOCKERFILE_COMMIT_SHORT_SHA

  sde:
    hostname: sde-${SDE_PLATFORM:-turtlebot3}
    container_name: sde_${SDE_PLATFORM:-turtlebot3}_${SDE_DOCKER_PROJECT:-user}-1
    privileged: true
    depends_on:
      sde-base:
        condition: service_started
    environment:
      # Pass current user and group IDs.
      - USER_ID=${USER_ID:-1000}
      - GROUP_ID=${GROUP_ID:-1000}
      # Display X Server GUIs.
      - DISPLAY=${DISPLAY:-:1}
      - QT_X11_NO_MITSHM=1
      # Configure the PulseAudio interface.
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      # Pass the platform identifier to the container.
      - SDE_PLATFORM=${SDE_PLATFORM:-turtlebot3}
    image: registry.gitlab.com/coarobo/sde/${SDE_PLATFORM:-turtlebot3}-devel:latest
    build:
      context: ../
      dockerfile: ./docker/${SDE_PLATFORM:-turtlebot3}-devel/Dockerfile
      args:
        - SDE_DOCKERFILE_COMMIT_SHORT_SHA
        - SDE_PLATFORM=${SDE_PLATFORM:-turtlebot3}
        - BASE_IMAGE=registry.gitlab.com/coarobo/sde/sde-devel:latest
    volumes:
      # Map repository root for convenient access.
      - ../:/root/SDE/
      # Grant display access to X Server.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Grant audio access to PulseAudio.
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
    devices:
      - /dev/:/dev/
    network_mode: host
    ipc: host
    pid: host
    command: /root/SDE/docker/sde-devel/scripts/initialize-docker-container.bash
