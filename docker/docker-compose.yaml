# version: "3.9"

################################################################################

# Base Docker Compose file for the SDE.
# Defines three services:
#   - 'sde-base'     : Build-only shared base image.
#   - 'sde-platform' : Build-only platform-specific image (inherits from 'sde-base').
#   - 'sde'          : Runtime user overlay container (inherits from 'sde-platform').

################################################################################

services:
  sde-base:
    image: ${SDE_DOCKER_REGISTRY}/sde-base:latest
    build:
      context: ../
      dockerfile: ./docker/sde-base/Dockerfile
      args:
        - SDE_DOCKERFILE_COMMIT_SHORT_SHA=${SDE_BASE_DOCKERFILE_COMMIT_SHORT_SHA}
        - SDE_CONTAINER_ROOT_DIR=${SDE_CONTAINER_ROOT_DIR}

  sde-platform:
    image: ${SDE_DOCKER_REGISTRY}/${SDE_ROBOT_PLATFORM}-devel:latest
    build:
      context: ../
      # The Dockerfile of the platform lives in the core or in an extension, as 'scripts/load-sde-env.bash' resolves it.
      dockerfile: ./${SDE_ROBOT_PLATFORM_DOCKERFILE}
      args:
        - SDE_DOCKERFILE_COMMIT_SHORT_SHA=${SDE_ROBOT_PLATFORM_DOCKERFILE_COMMIT_SHORT_SHA}
        - SDE_ROBOT_PLATFORM=${SDE_ROBOT_PLATFORM}
        - SDE_BASE_IMAGE=${SDE_DOCKER_REGISTRY}/sde-base:latest

  sde:
    hostname: sde-${SDE_ROBOT_PLATFORM}
    container_name: sde-${SDE_ROBOT_PLATFORM}-${SDE_DOCKER_PROJECT}-1
    privileged: true
    environment:
      # Pass current user and group IDs.
      - SDE_USER_ID=${SDE_USER_ID}
      - SDE_GROUP_ID=${SDE_GROUP_ID}
      # Display X Server GUIs.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Configure the PulseAudio interface.
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      # Pass the platform identifier to the container.
      - SDE_ROBOT_PLATFORM=${SDE_ROBOT_PLATFORM}
      # Pass the SDE root directory path.
      - SDE_CONTAINER_ROOT_DIR=${SDE_CONTAINER_ROOT_DIR}
    image: ${SDE_DOCKER_REGISTRY}/user-devel:latest
    build:
      context: ../
      dockerfile: ./docker/user-devel/Dockerfile
      args:
        - SDE_DOCKERFILE_COMMIT_SHORT_SHA=${SDE_USER_DEVEL_DOCKERFILE_COMMIT_SHORT_SHA}
        - SDE_ROBOT_PLATFORM=${SDE_ROBOT_PLATFORM}
        - SDE_PLATFORM_IMAGE=${SDE_DOCKER_REGISTRY}/${SDE_ROBOT_PLATFORM}-devel:latest
    volumes:
      # Map repository root for convenient access.
      - ../:${SDE_CONTAINER_ROOT_DIR}/
      # Grant display access to X Server.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Grant audio access to PulseAudio.
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
    devices:
      - /dev/:/dev/
    network_mode: host
    ipc: host
    pid: host
    command: ${SDE_CONTAINER_ROOT_DIR}/docker/sde-base/scripts/initialize-docker-container.bash
