# version: "3.9"

################################################################################

# RT Sciurus17 platform overlay for OpenRoSDE.
# Passes Sciurus17-specific environment variables to the container.

################################################################################

services:
  openrosde:
    environment:
      # No platform-specific environment variables for Sciurus17 at this time.
      - OPENROSDE_ROBOT_PLATFORM=${OPENROSDE_ROBOT_PLATFORM}
