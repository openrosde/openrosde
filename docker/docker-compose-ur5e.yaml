# version: "3.9"

################################################################################

# Universal Robots UR5e platform overlay for the SDE.
# Passes UR5e-specific environment variables to the container.

################################################################################

services:
  sde:
    environment:
      # IP address of the Universal Robots UR5e Teach Pendant.
      - SDE_UR5E_TEACH_PENDANT_IP=${SDE_UR5E_TEACH_PENDANT_IP}
      # IP address of the OnRobot Compute Box (gripper controller).
      - SDE_ONROBOT_COMPUTE_BOX_IP=${SDE_ONROBOT_COMPUTE_BOX_IP}
      # Whether to start the external Intel RealSense D435i camera at bringup.
      - SDE_UR5E_ENABLE_EXTERNAL_CAMERA=${SDE_UR5E_ENABLE_EXTERNAL_CAMERA}
      # Serial number of the wrist-mounted Intel RealSense D435 camera.
      - SDE_UR5E_WRIST_CAMERA_SERIAL_NO=${SDE_UR5E_WRIST_CAMERA_SERIAL_NO}
      # Serial number of the external Intel RealSense D435i camera.
      - SDE_UR5E_EXTERNAL_CAMERA_SERIAL_NO=${SDE_UR5E_EXTERNAL_CAMERA_SERIAL_NO}
      # Position and orientation of the external Intel RealSense D435i camera in the 'world' frame.
      - SDE_UR5E_EXTERNAL_CAMERA_X=${SDE_UR5E_EXTERNAL_CAMERA_X}
      - SDE_UR5E_EXTERNAL_CAMERA_Y=${SDE_UR5E_EXTERNAL_CAMERA_Y}
      - SDE_UR5E_EXTERNAL_CAMERA_Z=${SDE_UR5E_EXTERNAL_CAMERA_Z}
      - SDE_UR5E_EXTERNAL_CAMERA_ROLL=${SDE_UR5E_EXTERNAL_CAMERA_ROLL}
      - SDE_UR5E_EXTERNAL_CAMERA_PITCH=${SDE_UR5E_EXTERNAL_CAMERA_PITCH}
      - SDE_UR5E_EXTERNAL_CAMERA_YAW=${SDE_UR5E_EXTERNAL_CAMERA_YAW}
