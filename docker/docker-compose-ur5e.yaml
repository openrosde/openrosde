# version: "3.9"

################################################################################

# Universal Robots UR5e platform overlay for the SDE.
# Passes UR5e-specific environment variables to the container.

################################################################################

services:
  sde:
    environment:
      # IP address of the Universal Robots UR5e Teach Pendant.
      - SDE_UR5E_TEACH_PENDANT_IP=${SDE_UR5E_TEACH_PENDANT_IP}
      # IP address of the OnRobot Compute Box (gripper controller).
      - SDE_ONROBOT_COMPUTE_BOX_IP=${SDE_ONROBOT_COMPUTE_BOX_IP}
