# version: "3.9"

################################################################################

# Universal Robots UR5e platform overlay for OpenRoSDE.
# Passes UR5e-specific environment variables to the container.

################################################################################

services:
  openrosde:
    environment:
      # ROS package that holds the robot description, the SRDF, and the calibration of the UR5e.
      - OPENROSDE_UR5E_DESCRIPTION_PACKAGE=${OPENROSDE_UR5E_DESCRIPTION_PACKAGE}
      # IP address of the Universal Robots UR5e Teach Pendant.
      - OPENROSDE_UR5E_TEACH_PENDANT_IP=${OPENROSDE_UR5E_TEACH_PENDANT_IP}
      # IP address of the OnRobot Compute Box (gripper controller).
      - OPENROSDE_ONROBOT_COMPUTE_BOX_IP=${OPENROSDE_ONROBOT_COMPUTE_BOX_IP}
      # Whether to start the external Intel RealSense D435i camera at bringup.
      - OPENROSDE_UR5E_ENABLE_EXTERNAL_CAMERA=${OPENROSDE_UR5E_ENABLE_EXTERNAL_CAMERA}
      # Serial number of the wrist-mounted Intel RealSense D435 camera.
      - OPENROSDE_UR5E_WRIST_CAMERA_SERIAL_NO=${OPENROSDE_UR5E_WRIST_CAMERA_SERIAL_NO}
      # Serial number of the external Intel RealSense D435i camera.
      - OPENROSDE_UR5E_EXTERNAL_CAMERA_SERIAL_NO=${OPENROSDE_UR5E_EXTERNAL_CAMERA_SERIAL_NO}
      # Position and orientation of the external Intel RealSense D435i camera in the 'world' frame.
      - OPENROSDE_UR5E_EXTERNAL_CAMERA_X=${OPENROSDE_UR5E_EXTERNAL_CAMERA_X}
      - OPENROSDE_UR5E_EXTERNAL_CAMERA_Y=${OPENROSDE_UR5E_EXTERNAL_CAMERA_Y}
      - OPENROSDE_UR5E_EXTERNAL_CAMERA_Z=${OPENROSDE_UR5E_EXTERNAL_CAMERA_Z}
      - OPENROSDE_UR5E_EXTERNAL_CAMERA_ROLL=${OPENROSDE_UR5E_EXTERNAL_CAMERA_ROLL}
      - OPENROSDE_UR5E_EXTERNAL_CAMERA_PITCH=${OPENROSDE_UR5E_EXTERNAL_CAMERA_PITCH}
      - OPENROSDE_UR5E_EXTERNAL_CAMERA_YAW=${OPENROSDE_UR5E_EXTERNAL_CAMERA_YAW}
