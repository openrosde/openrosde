# version: "3.9"

################################################################################

# WSL 2 GPU overlay for OpenRoSDE.
# Enables GPU-accelerated rendering via the WSLg D3D12 Mesa driver.

################################################################################

services:
  openrosde:
    environment:
      # Enable GPU-accelerated OpenGL rendering via the WSLg D3D12 Mesa driver.
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      # Pass the Wayland display for WSLg native Wayland applications.
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
    volumes:
      # Mount the WSLg runtime resources (Wayland, X11, PulseAudio sockets).
      - /mnt/wslg:/mnt/wslg
      # Mount the WSL GPU driver libraries (D3D12 Mesa driver).
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib
