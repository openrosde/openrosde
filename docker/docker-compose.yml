# version: "3.9"

################################################################################

services:
  sde:
    hostname: sde
    privileged: true
    environment:
      # Display X Server GUIs.
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Configure the PulseAudio interface.
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    image: registry.gitlab.com/coarobo/sde/sde-devel:latest
    build:
      context: ../
      dockerfile: ./docker/sde-devel/Dockerfile
      args:
        - DOCKERFILE_COMMIT_SHORT_SHA
    volumes:
      # Map repository root for convenient access.
      - ../:/root/SDE/
      # Grant display access to X Server.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Grant audio access to PulseAudio.
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
    devices:
      - /dev/:/dev/
    network_mode: host
    ipc: host
    pid: host
    command: /root/SDE/docker/sde-devel/scripts/initialize-docker-container.bash
